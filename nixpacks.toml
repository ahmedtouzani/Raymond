# Nixpacks configuration for Railway
# This installs fonts needed for Canvas rank cards

[phases.setup]
nixPkgs = ["...", "liberation_ttf"]

[phases.install]
cmds = [
  "npm install"
]

# Migrate the database before loading any bot services or logging in to Discord.
[start]
cmd = "npm start"

[variables]
NIXPACKS_NODE_VERSION = "24"
